# fly.io config — see README-DEPLOY.md for the full walkthrough.
# Rename `app` before `fly launch` if the name is taken.
app = "new-game-proto"
primary_region = "ord"

[build]

[env]
  PORT = "3000"

# 256MB is tight for Node; swap absorbs boot/seed spikes without paying for 512MB.
swap_size_mb = 512

[http_service]
  internal_port = 3000
  force_https = true
  # Free-tier posture: suspend when idle, wake on request. Fly's proxy never
  # suspends a machine with open connections, and websockets count — so games
  # in progress keep the machine alive; an empty table costs ~nothing. State
  # is event-sourced in Postgres, so a wake-up loses nothing.
  auto_stop_machines = "suspend"
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "20s"
    method = "GET"
    path = "/healthz"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
