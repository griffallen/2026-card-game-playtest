# fly.io config — see README-DEPLOY.md for the full walkthrough.
# Rename `app` before `fly launch` if the name is taken.
app = "new-game-proto"
primary_region = "ord"

[build]

[env]
  PORT = "3000"

[http_service]
  internal_port = 3000
  force_https = true
  # WebSocket games dislike machines stopping under them; this stays tiny anyway.
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "20s"
    method = "GET"
    path = "/healthz"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
